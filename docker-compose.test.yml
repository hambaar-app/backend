networks:
  hambaar-network-test:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: 'false'

services:
  postgres:
    image: postgres:17-alpine
    container_name: hambaar-postgres-test
    hostname: hambaar.postgres.test
    environment:
      TZ: 'Asia/Tehran'
      PGTZ: 'Asia/Tehran'
      POSTGRES_DB: hambaar_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: '/data/postgres'
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hambaar_test']
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    networks:
      hambaar-network-test:

  redis:
    image: redis:8-alpine
    container_name: hambaar-redis-test
    hostname: hambaar.redis.test
    command: redis-server --appendonly no
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    networks:
      hambaar-network-test:
