name: Stable Merge

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    # Unit suite is fully mocked (no DB/Redis/network): the only env it may
    # see is NODE_ENV. No secrets here (T-6).
    env:
      NODE_ENV: test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Update and Upgrade image
        run: apt-get update -y
          && apt-get upgrade -y
          && apt-get install -y openssl
          && apt-get install -y bash

      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npm run prisma:generate

      # No lint gate: repo-wide CRLF/prettier debt predates the refactor
      # and would fail a clean check. Local workflow stays `npm run lint`
      # (--fix). Tracked for a whitespace-normalization pass post-refactor.
      - name: Type check
        run: npx tsc --noEmit

      - name: Run Unit Tests with Coverage
        run: npm test -- --coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  integration:
    runs-on: ubuntu-latest
    needs: test
    container: node:22-bookworm-slim
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hambaar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Dummy (non-secret) values only — SMS/Neshan/S3 are faked at the port
    # boundary inside the suite. NOTE: `npm run test:integration` carries
    # localhost defaults for local runs, so CI invokes push + jest directly.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hambaar_test
      REDIS_URL: redis://redis:6379
      OTP_REDIS_URL: redis://redis:6379/1
      SESSION_REDIS_URL: redis://redis:6379/2
      SESSION_SECRET: ci-session-secret-min-16-chars
      COOKIE_SECRET: ci-cookie-secret
      JWT_ACCESS_SECRET_KEY: ci-jwt-access-secret-min-16
      JWT_TEMP_SECRET_KEY: ci-jwt-temp-secret-min-16
      JWT_PROGRESS_SECRET_KEY: ci-jwt-progress-secret-min-16
      AWS_ACCESS_KEY: ci
      AWS_SECRET_KEY: ci
      AWS_BUCKET_NAME: ci-bucket
      AWS_ENDPOINT: https://s3.ci.local
      MAP_API_KEY: ci
      MAP_API_URL: https://maps.ci.local
      SMS_API_KEY: ci
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Update and Upgrade image
        run: apt-get update -y
          && apt-get upgrade -y
          && apt-get install -y openssl
          && apt-get install -y bash

      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Push Test Schema
        run: npx prisma db push --skip-generate

      - name: Run Integration Tests
        run: npx jest --config ./test/jest-integration.json

  build:
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: 1mimhe/hambaar-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=main-
            latest

      - name: Build Image and Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runtime
